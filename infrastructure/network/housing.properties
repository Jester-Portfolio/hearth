# 시스템 준비용 예제. 가격/크기/구획/정원은 추후 조정할 수 있습니다.
# housing.enabled는 기본 false이며 운영 설정에는 자동 적용하지 않습니다.
price-version=initial_example
allow-new-policy=false
purchases-enabled=false
tiers=small,medium,large,xlarge
tier.small.width=64
tier.small.price=10000
tier.medium.width=128
tier.medium.price=40000
tier.large.width=256
tier.large.price=160000
tier.xlarge.width=512
tier.xlarge.price=640000
max-members=8
max-loaded-worlds=4
idle-seconds=300
resource-spawn-radius=8
# 기본 거주 구획: 공용 스폰에서의 상대 X/Z, 시작 높이는 공용 입장점의 Y.
plots=first,second
plot.first.x=16
plot.first.z=0
plot.first.width=16
plot.first.height=32
plot.second.x=16
plot.second.z=18
plot.second.width=16
plot.second.height=32

# 설치/적용하지 않은 양식입니다. 검토한 고정 절대 경로·양의 정수로 치환합니다.
# Python이 있는 관측 호스트에서 private boot-id를 읽을 수 있는 최소 권한을 별도로 검토합니다.
# 임의 인자 UserParameter[*] 및 sudo를 사용하지 않습니다.
UserParameter=hearth.story.runtime,python3 REVIEWED_SCRIPTS_DIR/runtime_health.py --log REVIEWED_STORY_DATA/logs/latest.log --boot-file REVIEWED_STORY_BOOT_FILE --mode story --max-age REVIEWED_MAX_AGE_SECONDS
UserParameter=hearth.economy.runtime,python3 REVIEWED_SCRIPTS_DIR/runtime_health.py --log REVIEWED_ECONOMY_DATA/logs/latest.log --boot-file REVIEWED_ECONOMY_BOOT_FILE --mode economy --max-age REVIEWED_MAX_AGE_SECONDS

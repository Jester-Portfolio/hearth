# 격리 개발 모드의 공개 합성 시험값입니다. 실제 서사/밸런스나 스킵 보상 정책이 아닙니다.
format: 1
quests:
  - id: trial_checkpoint
    restart: CHECKPOINT
    failures: [DEATH, OBJECTIVE]
    checkpoints: [1]
    timeout-seconds: 0
    reward:
      items:
        - {material: STONE, amount: 3}
  - id: trial_keep
    restart: KEEP
    failures: [DEATH, OBJECTIVE]
    checkpoints: []
    timeout-seconds: 0
  - id: trial_beginning
    restart: BEGINNING
    failures: [DEATH, OBJECTIVE]
    checkpoints: []
    timeout-seconds: 0
  - id: trial_timeout
    restart: KEEP
    failures: [TIMEOUT]
    checkpoints: []
    timeout-seconds: 2
chapters:
  - id: public_review
    title: 공개 합성 조사 따라잡기
    shared-stage: trial_arrival
    required-quests: [trial_checkpoint, trial_keep, trial_beginning]

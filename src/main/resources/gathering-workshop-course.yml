      - description: 채집 구역에 다시 입장해 주변을 걸어 방문을 확인하세요. 나무 곡괭이로 돌을 캐면 조약돌을 얻을 수 있습니다.
        min-x: 32
        max-x: 35
        min-y: 64
        max-y: 66
        min-z: 0
        max-z: 3
        location: {kind: EXACT, x: 32.5, y: 64, z: 0.5}
      - description: /hearthgather leave로 나온 뒤 작업대에서 돌 곡괭이를 제작하고 안내원에게 보고하세요. 재료는 실제 제작에만 소모됩니다.
        min-x: 6
        max-x: 6
        min-y: 64
        max-y: 64
        min-z: 6
        max-z: 6
        interaction: craft:public_workbench:stone_pickaxe
        location: {kind: EXACT, x: 6, y: 64, z: 6}
    text:
      offer: 채집 구역과 작업대를 오가며 원목으로 나무 곡괭이를, 돌에서 얻은 조약돌로 돌 곡괭이를 제작해 주세요. 방문 목표는 채굴 횟수를 세지 않습니다.
      accept: 공개 채집과 도구 제작 수락
      active: 등록된 채집 구역을 방문하고 원목을 준비하세요.
      report-ready: 제작 결과를 저장했습니다. 시험 안내원에게 보고하세요.
      report: 채집과 도구 제작 보고
      completed: 채집과 도구 제작 실습을 보고했습니다.
      failure: 기존 재료와 진행을 보존했습니다. 상태를 확인하세요.

name: Hearth
version: '${version}'
main: io.github.jesterportfolio.hearth.HearthPlugin
api-version: '26.2'
depend: [WorldEdit, WorldGuard]
libraries:
  - 'org.postgresql:postgresql:${postgresJdbcVersion}'
  - 'com.zaxxer:HikariCP:${hikariVersion}'
description: Hearth S4 isolated multiworld verification foundation
commands:
  hearthfeatures:
    description: 개인 지도·장면·보관 안내
  hearthscene:
    description: 개인 필수 장면·선택·기록 재시청
  hearthmap:
    description: 개인 발견 지형 지도와 원형 미니맵
  hearthender:
    description: 시설의 진행별 개인 엔더 보관함
  hearthhud:
    description: 현재 목표 고정 HUD 표시 설정
  hearthtalk:
    description: 현재 NPC 대화의 페이지 이동·닫기
  hearthprepare:
    description: 본인의 공개 시설·재료·던전 준비 안내
  hearthresult:
    description: 본인의 공개 코스 결과와 관련 기록 조회
  hearthescort:
    description: 본인의 현재 호위 목표 현장 안내
  hearthresume:
    description: 저장된 개인 의뢰·보고·보상과 현재 코스 이어 하기
  hearthjourney:
    description: 공개 시험 코스의 다음 플레이 안내
  hearthinfo:
    description: 본인에게 공개된 게임 정보 조회
  hearthplay:
    description: 격리 플레이 조작 안내
  hearthquest:
    description: 격리 NPC 대화의 수락·보고 선택
  hearthphone:
    description: 격리 개발 모드 스마트폰 GUI
  hearthverify:
    description: Console-only isolated S4 verification
    permission: hearth.verify
permissions:
  hearth.verify:
    default: op

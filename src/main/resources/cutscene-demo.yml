format: 1
scenes:
  - id: public_arrival
    quest: survey_marker
    title: 공개 공동체의 첫 조사
    frames:
      - 주변을 살피고 안내원에게 이번 개인 조사를 확인합니다. 공동체의 공유 결정과 본인의 조사 기록은 각각 관리됩니다.
      - 도구와 시설을 직접 확인하고, 본인이 완료한 의뢰만 보고합니다. 다른 사람의 아이템과 개인 발견은 대신 확정하지 않습니다.
      - 준비를 마쳤습니다. 개인 의뢰·공유 조사·지도와 스마트폰의 현재 안내를 확인하세요.

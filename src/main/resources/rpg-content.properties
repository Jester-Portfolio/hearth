format=1
# Add content after balance decisions. Empty registries are intentional.
custom-skills=
custom-stats=
gear-stats=
# skill.<id>.name, passive-stat, passive-base, passive-per-level
# skill.<id>.active-effect=HEAL|SPEED|HASTE|RESISTANCE
# skill.<id>.active-value, active-seconds, active-mana, active-cooldown
# stat.<id>.name, trait (Aura namespaced id), coefficient
# gear.<id>.stat, upgrade-per-level, enchant-key (hearth PDC), enchant-per-level, cap
# gear.<id>.slots=main_hand,off_hand,head,chest,legs,feet
# gear.<id>.materials=minecraft:diamond_sword

# New worlds require explicit first preparation; existing worlds are never regenerated.
allow-create-extras=false
extra.novice.key=hearth_survival:novice
extra.novice.terrain=NORMAL
extra.end.key=hearth_survival:resource_end
extra.end.terrain=NORMAL
# actionbar, betterhud (hearth_rpg placeholder + native fallback), off
hud-mode=actionbar

        min-x: 20.0
        max-x: 22.0
        min-y: 64.0
        max-y: 67.0
        min-z: 8.0
        max-z: 10.0
      - description: 마지막 공개 표지 방문
        min-x: 20.0
        max-x: 22.0
        min-y: 64.0
        max-y: 67.0
        min-z: 14.0
        max-z: 16.0
    text:
      offer: '세 공개 표지를 순서대로 방문해 주세요. 보상과 아이템 소모는 없습니다.'
      accept: '[연속 조사 수락]'
      active: '공개 표지 조사를 진행합니다.'
      report-ready: '모든 표지를 방문했습니다. 시험 안내원에게 보고해 주세요.'
      report: '[연속 조사 보고]'
      completed: '공개 연속 경로 조사가 완료되었습니다.'
      failure: '조사 저장 상태를 확인할 수 없습니다.'

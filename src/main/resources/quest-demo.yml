      max-x: 26.0
      min-y: 64.0
      max-y: 67.0
      min-z: 2.0
      max-z: 4.0
    completion-mode: automatic
    title: 공개 후속 경로 조사
    npc-id: survey_guide
    objectives:
      - description: 후속 첫 표지 방문

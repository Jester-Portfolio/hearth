# 공개 시험 콘텐츠. 초기 로딩만 지원하며 기존 서버 파일을 자동으로 덮어쓰지 않습니다.
format: 2
npcs:
  - id: survey_guide
    name: 시험 안내원
    dialogue-pages:
      - 개인 조사는 각자 진행합니다. 같은 공동체라도 다른 사람이 보고했다고 본인의 조사가 완료되지는 않습니다.
      - 공동 조사는 현재 접속한 구성원 전원의 조건을 확인합니다. 중요한 경로는 채팅 투표로 결정하며 확정한 선택을 되돌리지 않습니다.
      - 스마트폰에서 퀘스트·탐험·일지·알림을 확인할 수 있습니다. 아래 퀘스트 선택지나 다음 플레이 안내를 이용해 주세요.
    topics:
      - id: personal_rules
        label: 개인 조사 기록은 어떻게 구분하나요?
        text: 같은 공동 진행에서도 개인 퀘스트·방문·인물 기록은 본인 기준으로 저장됩니다.
      - id: facility_clue
        label: 시설 조사에서 확인할 내용을 알려 주세요.
        text: 안내원 대화 뒤 공개 레버를 확인하고 마지막 조사 지점을 방문하세요. 일지에서 이 안내를 다시 확인할 수 있습니다.
        requires-completed: survey_marker
        journal: facility_clue
      - id: facility_result
        label: 시설 조사 결과를 정리해 주세요.
        text: 시설 조사를 보고한 본인의 기록만 확인했습니다. 이 대화가 다른 사람의 조사를 완료하지는 않습니다.
        requires-completed: contact_route
        journal: facility_result
    x: 3.5
    y: 64.0
    z: 5.5
  - id: field_researcher
    name: 공개 현장 조사원
    dialogue-pages:
      - 저는 의뢰를 주거나 보고를 받지 않습니다. 안내원의 개인 조사 중 필요한 현장 정보를 질문할 수 있습니다.
      - 직접 확인한 정보는 본인의 일지에서 다시 읽을 수 있습니다. 다른 사람의 기록은 함께 열리지 않습니다.
    topics:
      - id: research_clue
        label: 현장 조사에서는 무엇을 확인하나요?
        text: 현장 대화 뒤 공개 측정 구역을 방문하고 원래 안내원에게 보고하세요. 직접 질문한 내용은 개인 일지에 기록됩니다.
        requires-completed: contact_route
        journal: research_clue
    x: 10.5
    y: 64.0
    z: 5.5

# 공개 시험 콘텐츠. 초기 로딩만 지원하며 기존 서버 파일을 자동으로 덮어쓰지 않습니다.
format: 2
npcs:
  - id: survey_guide
    name: 시험 안내원
    dialogue-pages:
      - 개인 조사는 각자 진행합니다. 같은 공동체라도 다른 사람이 보고했다고 본인의 조사가 완료되지는 않습니다.
      - 공동 조사는 현재 접속한 구성원 전원의 조건을 확인합니다. 중요한 경로는 채팅 투표로 결정하며 확정한 선택을 되돌리지 않습니다.
      - 스마트폰에서 퀘스트·탐험·일지·알림을 확인할 수 있습니다. 아래 퀘스트 선택지나 다음 플레이 안내를 이용해 주세요.
    x: 3.5
    y: 64.0
    z: 5.5
quests:
  - id: survey_marker
    completion-mode: report
    title: 시험 지점 방문 조사
    npc-id: survey_guide
    objective:
      location: {kind: EXACT, x: 13, y: 64, z: 13}
      min-x: 12.0
      max-x: 14.0
      min-y: 64.0
      max-y: 67.0
      min-z: 12.0
      max-z: 14.0
    text:
      offer: '시험 지점 (12~14, 64~67, 12~14)을 방문한 뒤 돌아와 주세요. 보상과 아이템 소모는 없습니다.'
      accept: '[방문 조사 수락]'
      active: '방문 조사를 수락했습니다. 지정 지점을 방문해 주세요.'
      report-ready: '방문 조사를 마쳤습니다. 시험 안내원에게 보고해 주세요.'
      report: '[방문 조사 보고]'
      completed: '방문 조사 보고가 완료되었습니다. 완료 기록이 유지됩니다.'
      failure: '방문 조사 처리를 확인할 수 없습니다. 관리자 확인이 필요할 수 있습니다.'
  - id: path_marker
    completion-mode: automatic
    title: 시험 경로 확인
    npc-id: survey_guide
    objective:
      min-x: 12.0
      max-x: 14.0
      min-y: 64.0
      max-y: 67.0
      min-z: 2.0
      max-z: 4.0
    text:
      offer: '경로 지점 (12~14, 64~67, 2~4)을 방문하면 자동 완료됩니다. 보상과 아이템 소모는 없습니다.'
      accept: '[경로 확인 수락]'
      active: '경로 확인을 수락했습니다. 경로 지점을 방문해 주세요.'
      report-ready: '경로 확인을 마쳤습니다. 시험 안내원에게 보고해 주세요.'
      report: '[경로 확인 보고]'
      completed: '경로 확인이 자동 완료되었습니다. 완료 기록이 유지됩니다.'
      failure: '경로 확인 처리를 확인할 수 없습니다. 관리자 확인이 필요할 수 있습니다.'
  - id: entry_marker
    start-mode: automatic
    start-area:
      min-x: 5.0
      max-x: 7.0
      min-y: 64.0
      max-y: 67.0
      min-z: 8.0
      max-z: 10.0
    completion-mode: report
    title: 공개 구역 진입 조사
    npc-id: survey_guide
    objective:
      min-x: 12.0
      max-x: 14.0
      min-y: 64.0
      max-y: 67.0
      min-z: 8.0
      max-z: 10.0
    text:
      offer: '시작 구역 (5~7, 64~67, 8~10)에 들어가면 조사가 시작됩니다.'
      accept: '[구역 진입으로 시작]'
      active: '구역 진입 조사가 시작되었습니다. 목표 구역 (12~14, 64~67, 8~10)을 방문해 주세요.'
      report-ready: '목표 구역 조사를 마쳤습니다. 시험 안내원에게 보고해 주세요.'
      report: '[구역 조사 보고]'
      completed: '구역 조사가 완료되었습니다.'
      failure: '구역 조사 저장 상태를 확인할 수 없습니다.'
  - id: followup_marker
    requires-completed: survey_marker
    start-mode: automatic
    start-area:
      min-x: 5.0
      max-x: 7.0
      min-y: 64.0
      max-y: 67.0
      min-z: 16.0
      max-z: 18.0
    completion-mode: report
    title: 공개 후속 지점 조사
    npc-id: survey_guide
    objective:
      min-x: 12.0
      max-x: 14.0
      min-y: 64.0
      max-y: 67.0
      min-z: 16.0
      max-z: 18.0
    text:
      offer: '후속 시작 구역 (5~7, 64~67, 16~18)에 들어가면 조사가 시작됩니다.'
      accept: '[후속 구역에서 시작]'
      active: '후속 조사가 시작되었습니다. 목표 지점을 방문해 주세요.'
      report-ready: '후속 조사를 마쳤습니다. 시험 안내원에게 보고해 주세요.'
      report: '[후속 조사 보고]'
      completed: '후속 조사가 완료되었습니다.'
      failure: '후속 조사 저장 상태를 확인할 수 없습니다.'
  - id: route_marker
    start-mode: npc
    completion-mode: report
    title: 공개 연속 경로 조사
    npc-id: survey_guide
    objectives:
      - description: 첫 번째 공개 표지 방문
        location: {kind: EXACT, x: 21, y: 64, z: 3}
        min-x: 20.0
        max-x: 22.0
        min-y: 64.0
        max-y: 67.0
        min-z: 2.0
        max-z: 4.0
      - description: 두 번째 공개 표지 방문
        location: {kind: AREA, min-x: 18, max-x: 24, min-y: 63, max-y: 69, min-z: 6, max-z: 12}
        min-x: 20.0
        max-x: 22.0
        min-y: 64.0
        max-y: 67.0
        min-z: 8.0
        max-z: 10.0
      - description: 마지막 공개 표지 방문
        location: {kind: HIDDEN}
        min-x: 20.0
        max-x: 22.0
        min-y: 64.0
        max-y: 67.0
        min-z: 14.0
        max-z: 16.0
    text:
      offer: '세 공개 표지를 순서대로 방문해 주세요. 보상과 아이템 소모는 없습니다.'
      accept: '[연속 조사 수락]'
      active: '공개 표지 조사를 진행합니다.'
      report-ready: '모든 표지를 방문했습니다. 시험 안내원에게 보고해 주세요.'
      report: '[연속 조사 보고]'
      completed: '공개 연속 경로 조사가 완료되었습니다.'
      failure: '조사 저장 상태를 확인할 수 없습니다.'
  - id: route_followup
    requires-completed: route_marker
    start-mode: automatic
    start-area:
      min-x: 24.0
      max-x: 26.0
      min-y: 64.0
      max-y: 67.0
      min-z: 2.0
      max-z: 4.0
    completion-mode: automatic
    title: 공개 후속 경로 조사
    npc-id: survey_guide
    objectives:
      - description: 후속 첫 표지 방문
        min-x: 24.0
        max-x: 26.0
        min-y: 64.0
        max-y: 67.0
        min-z: 8.0
        max-z: 10.0
      - description: 후속 마지막 표지 방문
        min-x: 24.0
        max-x: 26.0
        min-y: 64.0
        max-y: 67.0
        min-z: 14.0
        max-z: 16.0
    text:
      offer: '후속 구역에 진입해 두 표지를 방문해 주세요.'
      accept: '[후속 구역 진입]'
      active: '후속 경로 조사를 진행합니다.'
      report-ready: '후속 경로 보고 대기'
      report: '[후속 경로 보고]'
      completed: '후속 경로 조사가 완료되었습니다.'
      failure: '후속 경로 저장 상태를 확인할 수 없습니다.'
  - id: contact_route
    title: 공개 시설과 대화 조사
    npc-id: survey_guide
    requires-completed: survey_marker
    completion-mode: report
    objectives:
      - {description: 안내원에게 조사 대화 다시 걸기, interaction: 'npc:survey_guide', min-x: 2, max-x: 5, min-y: 64, max-y: 67, min-z: 4, max-z: 7}
      - {description: 허용 구역의 공개 레버 확인, interaction: 'block:7:64:7:LEVER', min-x: 6, max-x: 8, min-y: 64, max-y: 67, min-z: 6, max-z: 8, location: {kind: EXACT, x: 7, y: 64, z: 7}}
      - {description: 마지막 공개 방문 지점 조사, min-x: 12, max-x: 14, min-y: 64, max-y: 67, min-z: 24, max-z: 26, location: {kind: EXACT, x: 13, y: 64, z: 25}}
    text:
      offer: 방문 조사를 보고한 뒤 대화·레버·방문 조사를 순서대로 진행하세요. 보상과 아이템 소모는 없습니다.
      accept: '[시설 조사 수락]'
      active: 공개 시설 조사를 진행합니다.
      report-ready: 시설 조사를 마쳤습니다. 안내원에게 보고해 주세요.
      report: '[시설 조사 보고]'
      completed: 공개 시설 조사를 보고했습니다.
      failure: 시설 조사 저장 상태를 확인할 수 없습니다.

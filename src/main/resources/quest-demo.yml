        max-z: 16.0
    text:
      offer: '후속 구역에 진입해 두 표지를 방문해 주세요.'
      accept: '[후속 구역 진입]'
      active: '후속 경로 조사를 진행합니다.'
      report-ready: '후속 경로 보고 대기'
      report: '[후속 경로 보고]'
      completed: '후속 경로 조사가 완료되었습니다.'
      failure: '후속 경로 저장 상태를 확인할 수 없습니다.'

# Never enable this in a production server. A matching JVM gate and marker are also required.
verification-enabled: false
# S4-5 전용 경로·JVM 플래그까지 확인해야 활성화됩니다. 일반 부팅에서는 DB에 연결하지 않습니다.
db-verification-enabled: false
# 초기 자동 저장 주기(초). 실제 플레이어 이벤트 연결은 일반 부팅에서 활성화하지 않습니다.
inventory-autosave-seconds: 30
# S4-6~8 명시적 격리 검증에서만 활성화합니다.
inventory-verification-enabled: false

# 새 S4-11 격리 경로와 JVM 승인 플래그가 모두 있을 때만 활성화합니다.
lifecycle-verification-enabled: false

# S4-11 새 격리 경로·lifecycle 설정·sessions JVM 게이트를 모두 요구합니다.
session-verification-enabled: false

# 세션 격리 모드와 별도의 JVM 게이트가 모두 필요합니다.
quest-verification-enabled: false

# 탐험·일지·지도는 기존 세션/퀘스트 격리 게이트와 별도의 JVM 플래그를 추가 요구합니다.
exploration-verification-enabled: false

# 기존 격리 세션·탐험 모드와 별도 sharedStory JVM 게이트를 추가 요구합니다.
story-verification-enabled: false

# Issue #1 단일 블록 효과. 기존 story 게이트와 별도 JVM 플래그가 모두 필요합니다.
world-effect-verification-enabled: false

# Never enable this in a production server. A matching JVM gate and marker are also required.
verification-enabled: false
# S4-5 전용 경로·JVM 플래그까지 확인해야 활성화됩니다. 일반 부팅에서는 DB에 연결하지 않습니다.
db-verification-enabled: false
# 초기 자동 저장 주기(초). 실제 플레이어 이벤트 연결은 일반 부팅에서 활성화하지 않습니다.
inventory-autosave-seconds: 30
# S4-6~8 명시적 격리 검증에서만 활성화합니다.
inventory-verification-enabled: false

# 새 S4-11 격리 경로와 JVM 승인 플래그가 모두 있을 때만 활성화합니다.
lifecycle-verification-enabled: false

# S4-11 새 격리 경로·lifecycle 설정·sessions JVM 게이트를 모두 요구합니다.
session-verification-enabled: false

# 세션 격리 모드와 별도의 JVM 게이트가 모두 필요합니다.
quest-verification-enabled: false

# 탐험·일지·지도는 기존 세션/퀘스트 격리 게이트와 별도의 JVM 플래그를 추가 요구합니다.
exploration-verification-enabled: false

# 기존 격리 세션·탐험 모드와 별도 sharedStory JVM 게이트를 추가 요구합니다.
story-verification-enabled: false

# Issue #1 단일 블록 효과. 기존 story 게이트와 별도 JVM 플래그가 모두 필요합니다.
world-effect-verification-enabled: false

# 새 격리 환경에서만 공개 시험 코스·안내를 켭니다.
playthrough-verification-enabled: false
# 새 격리 실행에서만 public-course-demo.yml을 선택할 수 있습니다.
playthrough-content-file: playthrough-demo.yml

# 기존 격리 퀘스트/세션 게이트 안에서만 동작하는 Dialog 프로토타입.
phone-dialog-enabled: false
phone-ai-mode: mock
# local 모드: 인증정보 없는 루프백 HTTP text/plain 프로토콜만 지원합니다.
phone-ai-endpoint: http://127.0.0.1:11435/ask

# 독립 경제 fixture 전용. 일반 서버에서는 비활성입니다.
economy-verification-enabled: false

# ADR-0008 이동 기술 경로만 격리 시험합니다. 일반 서버에서는 비활성입니다.
fast-travel-verification-enabled: false

# 제한 구역 채집 인던은 명시적 격리 시험에서만 활성화합니다.
gathering-verification-enabled: false

# 공개 던전 의뢰 연결도 명시적인 격리 개발 실행에서만 켭니다.
dungeon-play-verification-enabled: false

# 등록된 작업대의 순정 레시피 제작 메뉴. 일반 서버에서는 비활성입니다.
crafting-verification-enabled: false

# 공개 탐험·제작·개인 목표 연결도 명시적 격리 모드 전용입니다.
crafting-quest-verification-enabled: false

# 채집 자원과 제작 의뢰의 공개 실습 연결. 일반 서버에서는 비활성입니다.
gathering-workshop-verification-enabled: false

# 시설·재료·던전 준비의 읽기 전용 연결. 일반 서버에서는 비활성입니다.
play-preparation-verification-enabled: false

# 현장 채집 입퇴장 시설. 일반 서버에서는 비활성입니다.
gathering-facility-verification-enabled: false

# 기존 개인 실패/재시작 규칙을 사용하는 새 격리 호위 콘텐츠.
escort-verification-enabled: false

# 승인된 S4 기능 묶음: 기존 격리 서버/JVM 게이트와 함께 명시적으로 활성화합니다.
s4-features-enabled: false

# 전용 리소스팩의 선택형 원형 HUD. GUI 배율별 실제 배치는 클라이언트 검증 대상입니다.
minimap-overlay-enabled: false
minimap-horizontal-offset: 96

# 선택형 고정 HUD. BetterHud 지원 빌드와 별도 리소스팩 준비가 필요합니다.
betterhud-enabled: false

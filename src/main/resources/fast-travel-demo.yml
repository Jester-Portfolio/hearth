    marker-key: marker_outpost
    name: 공개 시험 초소
    region: public_fields
    category: 거점
    visibility: PUBLIC
    discovery: ENTRY
    hub: true
    bounds: {min-x: 10, max-x: 12, min-y: 64, max-y: 67, min-z: 10, max-z: 12}
    location: {kind: EXACT, x: 11, y: 64, z: 11}
stations:

    place: public_village
    facility: {x: 2, y: 64, z: 2, material: CHISELED_STONE_BRICKS}
    arrival: {x: 2.5, y: 64, z: 1.5, yaw: 0, pitch: 0}
  - id: outpost_station
    place: public_outpost
    facility: {x: 11, y: 64, z: 11, material: CHISELED_STONE_BRICKS}
    arrival: {x: 11.5, y: 64, z: 10.5, yaw: 180, pitch: 0}

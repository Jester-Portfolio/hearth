format=1
# Unknown destructive policies stay unset. They do not silently adopt vanilla/zero.
drop-unit=unset
xp-scope=unset
xp-rounding=unset
lost-xp-orbs=false
charm.scopes=none
death.public_home.xp=unset
death.public_home.drop=unset
death.private_home.xp=none
death.private_home.drop=0
death.novice_resource.xp=none
death.novice_resource.drop=0
death.resource.xp=third
death.resource.drop=0.05
death.nether.xp=third
death.nether.drop=0.05
death.end.xp=vanilla
death.end.drop=0.30
penalty.enabled=false
xp-blocked=none
abilities-blocked=none

# New configurations scope high-level reward reduction to the novice resource world.
# Omission in existing configurations preserves the previous all-role policy.
penalty-worlds=novice_resource
